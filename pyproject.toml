[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "confp"
version = "1.0.2"
description = "Configuration management using Jinja2 templates and pluggable backends"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Ellis Percival", email = "confp@failcode.co.uk" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "jinja2",
    "pyyaml",
    "cerberus",
]

[project.optional-dependencies]
redis = ["redis"]
etcd = ["python-etcd"]
terraform = ["boto3"]

[project.urls]
Repository = "https://github.com/flyte/confp"

[project.scripts]
confp = "confp.__main__:main"

[tool.hatch.build.targets.sdist]
exclude = ["docs/superpowers"]

[tool.hatch.build.targets.wheel]
packages = ["src/confp"]

[dependency-groups]
dev = [
    "pytest",
]
